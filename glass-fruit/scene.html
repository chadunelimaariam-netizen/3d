<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const params = new URLSearchParams(location.search);
const W = +params.get('w') || 1080, H = +params.get('h') || 1920;
const FRUIT = params.get('fruit') || 'apple';
const DURATION = 8;

// ---------- helpers ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(7);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const smooth = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const deg = THREE.MathUtils.degToRad;

// ---------- timeline (seconds) ----------
const T = {
  approachStart: 0.7, approachEnd: 2.1, touch: 2.45, crack: 2.85, cutStart: 2.95,
  cutEnd: 5.25, lift: 5.6, liftEnd: 6.2, fallStart: 6.0, land: 6.55, end: DURATION,
};

// ---------- fruit profiles (surface of revolution around Y, listed bottom -> top) ----------
function splineProfile(ctrl) {
  const pts = new THREE.SplineCurve(ctrl.map(([x, y]) => new THREE.Vector2(x, y))).getPoints(160);
  pts.forEach(p => { p.x = Math.max(p.x, 1e-4); });
  pts[0].x = pts[pts.length - 1].x = 1e-4;
  return pts;
}
function appleProfile() {
  const pts = [], n = 140;
  for (let i = 0; i <= n; i++) {
    const t = i / n * Math.PI;
    const r = Math.sin(t) * (1 - 0.12 * Math.cos(t));
    let y = -Math.cos(t) * 0.88;
    y += (y > 0 ? -0.24 : 0.12) * Math.exp(-Math.pow(r / 0.3, 2));
    pts.push(new THREE.Vector2(Math.max(r, 1e-4), y));
  }
  return pts;
}

// ---------- per-fruit look ----------
// colour(x, y, z, angle, out) paints the skin; cap(g, S, k) paints the cross-section.
const FRUITS = {
  apple: {
    profile: appleProfile,
    skin: { roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.02, iridescence: 0.12, sheen: 0.3, sheenColor: '#ff8080' },
    colour(x, y, z, a, c) {
      const streak = 0.5 + 0.5 * Math.sin(a * 9 + Math.sin(a * 3) * 2 + y * 3);
      c.set('#d3172a').lerp(new THREE.Color('#7e0814'), 0.45 * streak * smooth(seg(y, -0.6, 0.5)));
      c.lerp(new THREE.Color('#ee9a2c'), 0.55 * smooth(seg(-y, 0.1, 0.7)) * (0.5 + 0.5 * Math.cos(a - 1.0)));
      c.lerp(new THREE.Color('#7e0814'), 0.5 * smooth(seg(y, 0.55, 0.75)) * Math.exp(-Math.pow(Math.hypot(x, z) / 0.35, 2)));
    },
    stem: { pts: top => [[0, top - 0.06], [-0.03, top + 0.1], [-0.12, top + 0.26], [-0.22, top + 0.36]], radius: 0.038, color: '#5b3518' },
    leaf: { at: 1, offset: [0.02, -0.03, 0.03], scale: 1, color: '#2f9d48' },
    shard: '#c81a2a',
    cam: { dist: 10.4, target: 0.88 },
    audio: { seed: 99, pitch: 1 },
    cap(g, S, k) {
      const { P, path, U } = k;
      g.fillStyle = '#b3111f'; g.fillRect(0, 0, S, S);
      const [cx, cy] = P(0, 0.05);
      const grd = g.createRadialGradient(cx, cy, 10, cx, cy, S * 0.55);
      grd.addColorStop(0, '#fffaf6'); grd.addColorStop(0.55, '#fbe6de'); grd.addColorStop(1, '#efb5ad');
      g.fillStyle = grd; g.fill(path);
      g.save(); g.clip(path);
      frost(g, S, 'rgba(190,110,110,');
      for (const [lw, a] of [[90, 0.18], [60, 0.3], [36, 0.55], [18, 0.85], [8, 1]]) { g.lineWidth = lw; g.strokeStyle = `rgba(196,18,36,${a})`; g.stroke(path); }
      const [kx, ky] = P(0, 0.08);
      g.beginPath(); g.ellipse(kx, ky, U(0.22), U(0.27, 1), 0, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,236,214,0.55)'; g.fill(); g.lineWidth = 5; g.strokeStyle = 'rgba(214,150,120,0.55)'; g.stroke();
      const [tx, ty] = P(0, 0.62); g.beginPath(); g.moveTo(tx, ty); g.lineTo(kx, ky - U(0.27, 1)); g.lineWidth = 3; g.stroke();
      seeds(g, kx, ky + U(0.03, 1), U(0.09), U(0.07, 1), '#8a3a12', '#2e0f05');
      g.restore();
    },
  },

  pear: {
    profile: () => splineProfile([[0, -0.86], [0.25, -0.9], [0.6, -0.86], [0.88, -0.62], [0.99, -0.22], [0.93, 0.18], [0.74, 0.52], [0.55, 0.82], [0.46, 1.08], [0.39, 1.32], [0.25, 1.5], [0, 1.55]]),
    skin: { roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.02, iridescence: 0.2, sheen: 0.4, sheenColor: '#ffe7a0' },
    colour(x, y, z, a, c) {
      c.set('#e8ad1c');
      c.lerp(new THREE.Color('#a9b52e'), 0.65 * smooth(seg(y, 0.5, 1.45)));
      c.lerp(new THREE.Color('#c9561a'), 0.5 * (0.5 + 0.5 * Math.cos(a - 0.6)) * smooth(seg(y, -0.7, 0.4)) * (1 - smooth(seg(y, 0.6, 1.1))));
      c.lerp(new THREE.Color('#9a6a0c'), 0.6 * smooth(seg(-y, 0.7, 0.88)));
    },
    skinMap(g, w, h) { // freckles (lenticels)
      g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 4500; i++) { g.fillStyle = `rgba(110,60,15,${0.15 + rng() * 0.4})`; g.beginPath(); g.ellipse(rng() * w, rng() * h, 0.6 + rng() * 2.4, 0.6 + rng() * 1.6, 0, 0, Math.PI * 2); g.fill(); }
    },
    stem: { pts: top => [[0, top - 0.05], [-0.02, top + 0.14], [-0.09, top + 0.32], [-0.2, top + 0.44]], radius: 0.036, color: '#6b4420' },
    leaf: { at: 0.75, offset: [0.03, -0.02, 0.03], scale: 0.9, color: '#3c9e3a' },
    shard: '#e0a418',
    cam: { dist: 11.8, target: 1.28 },
    audio: { seed: 1234, pitch: 0.85 },
    cap(g, S, k) {
      const { P, path, U } = k;
      g.fillStyle = '#c98a12'; g.fillRect(0, 0, S, S);
      const [cx, cy] = P(0, -0.1);
      const grd = g.createRadialGradient(cx, cy, 10, cx, cy, S * 0.6);
      grd.addColorStop(0, '#fff8e0'); grd.addColorStop(0.6, '#f6e2a8'); grd.addColorStop(1, '#e6c070');
      g.fillStyle = grd; g.fill(path);
      g.save(); g.clip(path);
      for (let i = 0; i < 2200; i++) { g.fillStyle = `rgba(205,170,100,${rng() * 0.18})`; g.beginPath(); g.arc(rng() * S, rng() * S, 0.8 + rng() * 2.5, 0, Math.PI * 2); g.fill(); }
      frost(g, S, 'rgba(200,160,80,');
      for (const [lw, a] of [[80, 0.14], [50, 0.25], [28, 0.5], [14, 0.85], [6, 1]]) { g.lineWidth = lw; g.strokeStyle = `rgba(212,148,18,${a})`; g.stroke(path); }
      const [kx, ky] = P(0, -0.2);
      g.beginPath(); g.ellipse(kx, ky, U(0.24), U(0.4, 1), 0, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,248,226,0.75)'; g.fill(); g.lineWidth = 7; g.strokeStyle = 'rgba(184,138,66,0.65)'; g.stroke();
      const [tx, ty] = P(0, 1.5); g.beginPath(); g.moveTo(tx, ty); g.lineTo(kx, ky - U(0.4, 1)); g.lineWidth = 5; g.stroke();
      seeds(g, kx, ky + U(0.04, 1), U(0.17), U(0.17, 1), '#8a5220', '#2a1405');
      g.restore();
    },
  },

  orange: {
    profile: () => splineProfile([[0, -0.82], [0.2, -0.86], [0.55, -0.8], [0.85, -0.5], [0.99, -0.04], [0.95, 0.4], [0.72, 0.75], [0.36, 0.9], [0.13, 0.88], [0, 0.85]]),
    skin: { roughness: 0.1, clearcoat: 1, clearcoatRoughness: 0.03, iridescence: 0.15, sheen: 0.3, sheenColor: '#ffc070', bumpScale: 2.2 },
    colour(x, y, z, a, c) {
      const mott = 0.5 + 0.5 * Math.sin(a * 13 + y * 7 + Math.sin(a * 5) * 1.5);
      c.set('#ff7f0c').lerp(new THREE.Color('#e45a00'), 0.35 * mott);
      c.lerp(new THREE.Color('#ffa024'), 0.35 * smooth(seg(y, -0.2, 0.6)) * (0.5 + 0.5 * Math.cos(a + 0.8)));
      c.lerp(new THREE.Color('#9a8a1a'), 0.6 * Math.exp(-Math.pow(Math.hypot(x, z) / 0.12, 2)) * smooth(seg(y, 0.6, 0.85)));
    },
    skinMap(g, w, h) {
      g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(200,80,0,${rng() * 0.18})`; g.beginPath(); g.arc(rng() * w, rng() * h, 0.6 + rng() * 1.8, 0, Math.PI * 2); g.fill(); }
    },
    bumpMap(g, w, h) { // peel pores
      g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 14000; i++) {
        const x = rng() * w, y = rng() * h, r = 1.2 + rng() * 2.6;
        const gr = g.createRadialGradient(x, y, 0, x, y, r);
        gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
      }
    },
    stem: { pts: top => [[0, top - 0.04], [-0.01, top + 0.05], [-0.035, top + 0.1]], radius: 0.05, color: '#6d7f2a' },
    calyx: { color: '#4f8f2c' },
    leaf: { at: 1, offset: [0.0, -0.03, 0.03], scale: 1.15, color: '#2c8f3e' },
    shard: '#ff7a10',
    cam: { dist: 10.6, target: 0.92 },
    audio: { seed: 4321, pitch: 1.12 },
    cap(g, S, k) {
      const { P, path, U, outerR } = k;
      g.fillStyle = '#f06a00'; g.fillRect(0, 0, S, S);
      const [cx, cy] = P(0, 0);
      const grd = g.createRadialGradient(cx, cy, 10, cx, cy, S * 0.55);
      grd.addColorStop(0, '#ffe2a6'); grd.addColorStop(0.55, '#ffb444'); grd.addColorStop(1, '#f68a10');
      g.fillStyle = grd; g.fill(path);
      g.save(); g.clip(path);
      // juice sacs radiating out from the core
      for (let i = 0; i < 3200; i++) {
        const fx = (rng() * 2 - 1) * 0.95, fy = -0.8 + rng() * 1.6;
        if (Math.abs(fx) > outerR(fy) * 0.86) continue;
        const [x, y] = P(fx, fy), ang = Math.atan2(-fy * 0.35, fx);
        g.save(); g.translate(x, y); g.rotate(ang);
        g.beginPath(); g.ellipse(0, 0, 7 + rng() * 12, 2 + rng() * 3, 0, 0, Math.PI * 2);
        g.fillStyle = `rgba(255,${200 + rng() * 55 | 0},${120 + rng() * 100 | 0},${0.18 + rng() * 0.3})`; g.fill();
        g.strokeStyle = 'rgba(214,110,10,0.18)'; g.lineWidth = 1; g.stroke();
        g.restore();
      }
      // segment membranes (meridians seen edge-on)
      for (let kk = -3; kk <= 3; kk++) {
        if (kk === 0) continue;
        const c = Math.sin(kk * Math.PI / 7);
        g.beginPath();
        for (let fy = -0.74; fy <= 0.78; fy += 0.02) { const [x, y] = P(outerR(fy) * 0.86 * c, fy); fy > -0.74 ? g.lineTo(x, y) : g.moveTo(x, y); }
        g.strokeStyle = 'rgba(255,244,226,0.7)'; g.lineWidth = 4; g.stroke();
      }
      // central pith column
      const [c0x, c0y] = P(0, -0.74), [, c1y] = P(0, 0.78);
      g.fillStyle = 'rgba(255,246,232,0.85)'; g.fillRect(c0x - U(0.04) / 2, c1y, U(0.04), c0y - c1y);
      frost(g, S, 'rgba(255,140,0,');
      // white pith then a thin peel
      g.lineWidth = U(0.2); g.strokeStyle = 'rgba(255,240,214,0.97)'; g.stroke(path);
      g.lineWidth = U(0.07); g.strokeStyle = '#f06800'; g.stroke(path);
      g.lineWidth = U(0.03); g.strokeStyle = '#e05a00'; g.stroke(path);
      seeds(g, cx, cy + U(0.1, 1), U(0.12), U(0.06, 1), '#fff4dc', '#e8c890');
      g.restore();
    },
  },
};
// real red apple under a honey glaze, cut smoothly (no crack, no shards)
FRUITS.honeyapple = {
  ...FRUITS.apple,
  honey: true, shards: false, smoothCut: true, realCut: true, lumpy: true, juice: true, aperture: 0.0022,
  colour(x, y, z, a, c) { // colour lives in skinMap; vertex colour only darkens the stem cavity
    c.setScalar(1 - 0.35 * Math.exp(-Math.pow(Math.hypot(x, z) / 0.3, 2)) * smooth(seg(y, 0.4, 0.7)));
  },
  skin: { roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.12, iridescence: 0, sheen: 0.35, sheenColor: '#ff9a8a', sheenRoughness: 0.5, bumpScale: 0.6 },
  skinMap(g, w, h) { // u runs around the apple, v from calyx (bottom row) to stem (top row)
    const vg = g.createLinearGradient(0, 0, 0, h);
    vg.addColorStop(0, '#b8a040'); vg.addColorStop(0.05, '#c46a2a'); vg.addColorStop(0.12, '#a8101c'); vg.addColorStop(0.55, '#b51522');
    vg.addColorStop(0.85, '#c0301f'); vg.addColorStop(0.95, '#c79a3a'); vg.addColorStop(1, '#a08a3a');
    g.fillStyle = vg; g.fillRect(0, 0, w, h);
    const wrap = fn => { fn(0); fn(-w); fn(w); }; // tile across the lathe seam
    for (let i = 0; i < 40; i++) { // blush and sun-side patches
      const x = rng() * w, y = h * (0.15 + rng() * 0.7), r = 80 + rng() * 260, yellow = rng() < 0.35;
      wrap(o => {
        const gr = g.createRadialGradient(x + o, y, 0, x + o, y, r);
        gr.addColorStop(0, yellow ? 'rgba(214,150,50,0.22)' : 'rgba(120,6,18,0.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.fillRect(x + o - r, y - r, 2 * r, 2 * r);
      });
    }
    for (let i = 0; i < 1600; i++) { // streaks running stem to calyx
      const x = rng() * w, y0 = h * (0.04 + rng() * 0.3), y1 = y0 + h * (0.25 + rng() * 0.6), dark = rng() < 0.6;
      g.strokeStyle = dark ? `rgba(110,4,16,${0.12 + rng() * 0.25})` : `rgba(230,70,50,${0.08 + rng() * 0.18})`;
      g.lineWidth = 1 + rng() * 4;
      wrap(o => { g.beginPath(); for (let y = y0; y <= y1; y += 8) { const xx = x + o + Math.sin(y * 0.01 + i) * 6; y === y0 ? g.moveTo(xx, y) : g.lineTo(xx, y); } g.stroke(); });
    }
    for (let i = 0; i < 5000; i++) { // lenticels
      const r = 0.6 + rng() * 1.6;
      g.fillStyle = `rgba(240,210,150,${0.35 + rng() * 0.45})`;
      g.beginPath(); g.ellipse(rng() * w, h * (0.06 + rng() * 0.88), r, r * 0.8, 0, 0, Math.PI * 2); g.fill();
    }
  },
  bumpMap(g, w, h) {
    g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 30000; i++) { g.fillStyle = `rgba(${rng() < 0.5 ? '0,0,0' : '255,255,255'},${rng() * 0.12})`; g.fillRect(rng() * w, rng() * h, 1 + rng() * 2, 1 + rng() * 2); }
    for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(255,255,255,${0.2 + rng() * 0.3})`; g.beginPath(); g.arc(rng() * w, rng() * h, 0.8 + rng() * 1.4, 0, Math.PI * 2); g.fill(); }
  },
  roughMap(g, w, h) { // waxy, slightly uneven bloom
    g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 300; i++) {
      const x = rng() * w, y = rng() * h, r = 30 + rng() * 140, gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, rng() < 0.5 ? 'rgba(60,60,60,0.25)' : 'rgba(230,230,230,0.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
  },
  leafMap(g, w, h) {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#2f6e1e'); gr.addColorStop(0.5, '#4f9a2e'); gr.addColorStop(1, '#2f6e1e');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(200,230,150,0.7)'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
    g.lineWidth = 2; g.strokeStyle = 'rgba(190,225,140,0.45)';
    for (let x = 30; x < w; x += 45) for (const s of [-1, 1]) { g.beginPath(); g.moveTo(x, h / 2); g.quadraticCurveTo(x + 40, h / 2 + s * h * 0.2, x + 70, h / 2 + s * h * 0.45); g.stroke(); }
    for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(${rng() < 0.5 ? '20,60,10' : '140,190,90'},${rng() * 0.15})`; g.fillRect(rng() * w, rng() * h, 2, 2); }
  },
  audio: { seed: 777, pitch: 1, style: 'apple' },
  capSize: 2048,
  capMat: { roughness: 0.35, clearcoat: 0.3, clearcoatRoughness: 0.16, sheen: 0.25, sheenColor: new THREE.Color('#fff6e0'), emissiveIntensity: 0, bumpScale: 0.25, envMapIntensity: 0.9 },
  cap(g, S, k) {
    const { P, path, U } = k;
    g.fillStyle = '#9e0f1b'; g.fillRect(0, 0, S, S);
    const [cx, cy] = P(0, 0.05);
    const grd = g.createRadialGradient(cx, cy, 10, cx, cy, S * 0.52);
    grd.addColorStop(0, '#f6ecd0'); grd.addColorStop(0.35, '#fbf5e4'); grd.addColorStop(0.8, '#f7f0d8'); grd.addColorStop(1, '#eef0c8');
    g.fillStyle = grd; g.fill(path);
    g.save(); g.clip(path);
    for (let i = 0; i < 500; i++) { // soft mottling
      const x = rng() * S, y = rng() * S, r = 20 + rng() * 90, gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, rng() < 0.5 ? 'rgba(240,228,190,0.06)' : 'rgba(255,253,244,0.12)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    for (let i = 0; i < 60000; i++) { // flesh cells and tiny pores
      const r = 0.7 + rng() * 1.8, dark = rng() < 0.55;
      g.fillStyle = dark ? `rgba(226,208,160,${0.06 + rng() * 0.1})` : `rgba(255,255,250,${0.15 + rng() * 0.3})`;
      g.beginPath(); g.ellipse(rng() * S, rng() * S, r, r * (0.6 + rng() * 0.4), rng() * 3.14, 0, Math.PI * 2); g.fill();
    }
    for (let i = 0; i < 5000; i++) { // faint fibres radiating from the core
      const x = rng() * S, y = rng() * S, a = Math.atan2(y - cy, x - cx), l = 6 + rng() * 12;
      g.strokeStyle = `rgba(222,200,150,${0.04 + rng() * 0.06})`; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    for (let a = 0; a < Math.PI * 2; a += 0.015) { // dotted vascular ring around the core
      const [x, y] = P(Math.sin(a) * 0.5, 0.04 + Math.cos(a) * 0.55);
      g.fillStyle = `rgba(190,170,110,${0.25 + rng() * 0.3})`; g.beginPath(); g.arc(x, y, 1.5 + rng() * 1.5, 0, Math.PI * 2); g.fill();
    }
    const [kx, ky] = P(0, 0.04);

  updateHoney = t => {
    updateShell(t);
    const grow = lerp(0.92, 1.06, t / DURATION);
    pool.scale.set(grow, 1, grow);
    const cp = smooth(cutProgress(t));
    smear.visible = cp > 0.01;
    smear.scale.set(1, Math.max(cp, 0.01), 1);
    for (const s of strands) {
      const ok = t < s.breakT && ends(s, t), L = ok ? A.distanceTo(B) : 0;
      s.mesh.visible = ok && L > 0.004;
      if (s.mesh.visible) setTube(s.mesh.geometry, A, B, 0.15 * L * L + 0.02, s.r0 * clamp(Math.sqrt(0.15 / (L + 0.15)), 0.3, 1));
    }
  };
}

// ---------- camera ----------
const focusPt = new THREE.Vector3();
function placeCamera(t) {
  const reveal = smooth(seg(t, 5.6, 8));
  const d = lerp(CFG.cam.dist, CFG.cam.dist * 0.885, smooth(t / DURATION)) - 0.6 * reveal;
  const el = deg(lerp(13, 30, reveal)), az = deg(lerp(-3, 4, t / DURATION));
  focusPt.set(0, lerp(CFG.cam.target, CFG.cam.target * 0.9, reveal), 0);
  camera.position.set(focusPt.x + d * Math.sin(az) * Math.cos(el), focusPt.y + d * Math.sin(el), focusPt.z + d * Math.cos(az) * Math.cos(el));
  camera.lookAt(focusPt);
  return d;
}

// ---------- post ----------
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 9, aperture: CFG.aperture || 0.0035, maxblur: 0.007 });
composer.addPass(bokeh);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.22, 0.35, 0.92));
composer.addPass(new OutputPass());

// ---------- frame ----------
function poseAt(t) {
  const k = knifeState(t);
  knife.position.set(0, k.y, k.z);
  knife.rotation.x = k.tilt;
  const wedge = 0.045 * smooth(cutProgress(t));
  const fall = frontFall(t);
  const slide = easeOut(seg(t, T.fallStart, T.land + 0.3));
  placeHalf(front, wedge + fall, 0.2 * slide, 0.55 * slide); // falls open toward the right, out of the reveal
  const wobble = t > T.land ? 0.025 * Math.exp(-4 * (t - T.land)) * Math.sin(16 * (t - T.land)) : 0;
  placeHalf(back, wedge * 0.5 + wobble, 0);
}
function renderAt(t) {
  const d = placeCamera(t);
  bokeh.uniforms.focus.value = d - 0.7;
  poseAt(t);
  const f = t < T.crack || CFG.shards === false ? 0 : Math.exp(-(t - T.crack) / 0.09);
  flash.material.opacity = f;
  flash.material.rotation = 0.3 + (t - T.crack) * 0.8;
  flash.scale.setScalar(0.25 + 0.6 * f);
  flash.visible = f > 0.01;
  updateShards(t);
  updateHoney(t);
  composer.render();
}
window.renderAt = renderAt;
window.getAudioData = () => {
  resetSim(); stepSim(DURATION);
  // per-millisecond knife speed, and how much flesh the edge is in (for crunch density)
  const scrape = [], width = [];
  for (let i = 0; i < DURATION * 1000; i++) {
    const t = i / 1000;
    if (t < (CFG.smoothCut ? T.touch : T.cutStart) || t > T.cutEnd) { scrape.push(0); width.push(0); continue; }
    const a = knifeState(t), b = knifeState(t + 0.001);
    scrape.push(Math.min(1, Math.abs(b.y - a.y) / 0.001 * 1.4 + Math.abs(b.z - a.z) / 0.001 * 0.6));
    width.push(outerR(a.y) / MAX_R);
  }
  const out = { T, impacts: sim.impacts, scrape, width, audio: CFG.audio, honeyBreaks };
  resetSim();
  return out;
};
window.DURATION = DURATION;

precomputeHoney();
renderAt(0);
window.sceneReady = true;
if (!params.has('render')) {
  const t0 = performance.now();
  renderer.setAnimationLoop(() => renderAt(((performance.now() - t0) / 1000) % DURATION));
}
</script>
</body>
